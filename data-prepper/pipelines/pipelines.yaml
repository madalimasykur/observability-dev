trace-entry-pipeline:
  delay: "100"
  source:
    otel_trace_source:
      port: 21890
      ssl: false
      health_check_service: true
      authentication:
        unauthenticated:
  buffer:
    bounded_blocking:
      buffer_size: 2048
      batch_size: 256
  sink:
    - pipeline:
        name: trace-raw-pipeline
    - pipeline:
        name: trace-service-map-pipeline

trace-raw-pipeline:
  delay: "100"
  source:
    pipeline:
      name: trace-entry-pipeline
  buffer:
    bounded_blocking:
      buffer_size: 2048
      batch_size: 256
  processor:
    - otel_traces:
        trace_flush_interval: 5
  sink:
    - opensearch:
        hosts: ["https://opensearch:9200"]
        insecure: true
        username: admin
        password: "Nusantara123!@#"
        index_type: trace-analytics-raw

trace-service-map-pipeline:
  delay: "100"
  source:
    pipeline:
      name: trace-entry-pipeline
  buffer:
    bounded_blocking:
      buffer_size: 2048
      batch_size: 256
  processor:
    - service_map:
        window_duration: 10
  sink:
    - opensearch:
        hosts: ["https://opensearch:9200"]
        insecure: true
        username: admin
        password: "Nusantara123!@#"
        index_type: trace-analytics-service-map
