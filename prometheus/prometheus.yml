# yaml-language-server: $schema=https://json.schemastore.org/prometheus.json
# Prometheus scrape config

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: otel-metrics
    static_configs:
      - targets:
          - otel-collector:9464

  - job_name: order-sample-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.containers.internal:8010

  - job_name: podman-rootful
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.containers.internal:9101
