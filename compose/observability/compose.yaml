#
# Run this stack from the repository root so ${PWD} resolves to this project.
services:
  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: observability-prometheus
    user: "65534:65534"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
      - "madalimasykur.mylab.local:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ${PWD}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ${PWD}/data/prometheus:/prometheus:Z
    networks:
      - observability

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: observability-grafana
    user: "472:0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "3330:3000"
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
      - "madalimasykur.mylab.local:host-gateway"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_METRICS_ENABLED: "true"
      GF_USERS_ALLOW_SIGN_UP: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ${PWD}/data/grafana:/var/lib/grafana:Z
      - ${PWD}/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ${PWD}/cert/root-ca.crt:/etc/ssl/certs/root-ca.crt:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - observability

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: observability-node-exporter
    hostname: madalimasykur
    user: "65534:65534"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    pid: host
    command:
      - "--web.listen-address=0.0.0.0:9100"
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/containers/.+|var/lib/docker/.+)($$|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$"
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
      - "madalimasykur.mylab.local:host-gateway"
    networks:
      - observability

  loki:
    image: docker.io/grafana/loki:3.5.5
    container_name: observability-loki
    user: "10001:10001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    volumes:
      - ${PWD}/loki/loki.yml:/etc/loki/local-config.yaml:ro,Z
      - ${PWD}/data/loki:/loki:Z
    networks:
      - observability

  alloy:
    image: docker.io/grafana/alloy:latest
    container_name: observability-alloy
    restart: unless-stopped
    user: "0:0"
    group_add:
      - keep-groups
    security_opt:
      - label=disable
    healthcheck:
      test: ["CMD", "/bin/alloy", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    volumes:
      - ${PWD}/alloy/config.alloy:/etc/alloy/config.alloy:ro,Z
      - ${PWD}/data/alloy:/var/lib/alloy/data:Z
      - ${PWD}/logs:/var/log/order-sample-service:ro,Z
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    depends_on:
      - loki
    networks:
      - observability

  tempo:
    image: docker.io/grafana/tempo:2.8.2
    container_name: observability-tempo
    user: "10001:10001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command:
      - "-config.file=/etc/tempo/tempo.yml"
    ports:
      - "3200:3200"
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
      - "madalimasykur.mylab.local:host-gateway"
    volumes:
      - ${PWD}/tempo/tempo.yml:/etc/tempo/tempo.yml:ro,Z
      - ${PWD}/data/tempo:/var/tempo:Z
    networks:
      - observability

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.154.0
    container_name: observability-otel-collector
    # Match the host user so the systemd receiver can access its D-Bus bus
    # without running the collector as root.
    user: "1000:1000"
    userns_mode: host
    restart: unless-stopped
    security_opt:
      - label=disable
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command:
      - "--config=/etc/otelcol/config.yml"
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8880:8888"
      - "9464:9464"
    volumes:
      - ${PWD}/otel-collector/config.yml:/etc/otelcol/config.yml:ro,Z
      - /run/user/1000/bus:/run/user/1000/bus:ro
    environment:
      XDG_RUNTIME_DIR: /run/user/1000
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
      - "madalimasykur.mylab.local:host-gateway"
    depends_on:
      - tempo
      - loki
    networks:
      - observability

  podman-exporter:
    image: quay.io/navidys/prometheus-podman-exporter:v1.21.2
    container_name: observability-podman-exporter
    restart: unless-stopped
    userns_mode: "keep-id:uid=65534"
    security_opt:
      - label=type:container_runtime_t
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9101/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - "--web.listen-address=:9101"
    environment:
      CONTAINER_HOST: unix:///run/podman/podman.sock
    ports:
      - "9101:9101"
    volumes:
      # Use the dedicated systemd socket directory. Mounting the directory
      # avoids retaining a stale socket inode if the API service restarts.
      - /run/user/1000/podman-exporter-api:/run/podman:ro
    networks:
      - observability

networks:
  observability:
    external: true
    name: observability
