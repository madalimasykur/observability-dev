#
# Run this stack from the repository root so ${PWD} resolves to this project.
services:
  tempo:
    image: docker.io/grafana/tempo:2.8.2
    container_name: observability-tempo
    user: "10001:10001"
    restart: unless-stopped
    command:
      - "-config.file=/etc/tempo/tempo.yml"
    ports:
      - "3200:3200"
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
      - "madalimasykur.mylab.local:host-gateway"
    volumes:
      - ${PWD}/tempo/tempo.yml:/etc/tempo/tempo.yml:ro,Z
      - ${PWD}/data/tempo:/var/tempo:Z
    networks:
      - observability

  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.154.0
    container_name: observability-otel-collector
    user: "10001:10001"
    restart: unless-stopped
    command:
      - "--config=/etc/otelcol/config.yml"
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8880:8888"
      - "9464:9464"
    volumes:
      - ${PWD}/otel-collector/config.yml:/etc/otelcol/config.yml:ro,Z
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"
      - "madalimasykur.mylab.local:host-gateway"
    depends_on:
      - tempo
    networks:
      - observability

networks:
  observability:
    external: true
    name: observability
